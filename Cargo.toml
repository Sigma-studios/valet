[package]
name = "valet"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
mail-parser = "0.11.9"
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rrule = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
webpki-roots = "1.0.10"
