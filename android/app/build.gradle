// valet's Android app: valet's own site in a window, plus alarms that ring.
// No library: the platform's WebView, AlarmManager and notifications.
plugins {
    id "com.android.application"
}

android {
    namespace "app.valet"
    compileSdk 35

    defaultConfig {
        applicationId "app.valet"
        minSdk 26
        targetSdk 35
        // From install.sh: the number of commits touching android/.
        versionCode((project.findProperty("versionCode") ?: "1").toInteger())
        versionName "build $versionCode"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
